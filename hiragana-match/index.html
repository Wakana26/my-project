<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ひらがな カードマッチ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    h1 {
      color: white;
      font-size: 2rem;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
      margin: 12px 0 4px;
      letter-spacing: 2px;
    }

    .subtitle {
      color: rgba(255,255,255,0.85);
      font-size: 0.95rem;
      margin-bottom: 16px;
    }

    /* ── Difficulty selector ── */
    #level-screen {
      background: white;
      border-radius: 20px;
      padding: 32px 40px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 420px;
      width: 100%;
    }
    #level-screen h2 { font-size: 1.4rem; color: #444; margin-bottom: 8px; }
    #level-screen p  { color: #777; margin-bottom: 24px; font-size: 0.95rem; }

    .level-btn {
      display: block; width: 100%;
      padding: 14px 20px;
      margin: 10px 0;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .level-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
    .level-btn:active { transform: translateY(0); }

    .btn-easy   { background: #56d176; color: white; }
    .btn-medium { background: #f7b731; color: white; }
    .btn-hard   { background: #fc5c65; color: white; }

    /* ── Stats bar ── */
    #stats {
      display: none;
      gap: 20px;
      margin-bottom: 16px;
    }
    .stat-box {
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(6px);
      border-radius: 12px;
      padding: 8px 20px;
      color: white;
      text-align: center;
      min-width: 90px;
    }
    .stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.85; }
    .stat-value { font-size: 1.5rem; font-weight: bold; }

    /* ── Card grid ── */
    #board {
      display: none;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 700px;
      width: 100%;
    }

    .card {
      width: 90px; height: 90px;
      perspective: 600px;
      cursor: pointer;
    }

    .card-inner {
      width: 100%; height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(.4,2,.6,1);
      border-radius: 14px;
    }
    .card.flipped .card-inner { transform: rotateY(180deg); }
    .card.matched .card-inner { transform: rotateY(180deg); }

    .card-face {
      position: absolute; inset: 0;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    }

    .card-back {
      background: linear-gradient(135deg, #a8edea, #fed6e3);
      font-size: 2.2rem;
    }

    .card-front {
      transform: rotateY(180deg);
      font-weight: bold;
      user-select: none;
    }

    /* Hiragana cards: purple */
    .card-front.type-hira {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: white;
      font-size: 2.6rem;
    }
    /* Romaji cards: orange */
    .card-front.type-roma {
      background: linear-gradient(135deg, #f97316, #fbbf24);
      color: white;
      font-size: 1.5rem;
      letter-spacing: 1px;
    }

    .card.matched .card-front {
      background: linear-gradient(135deg, #10b981, #34d399) !important;
      animation: pop 0.4s ease;
    }
    .card.shake .card-inner { animation: shake 0.4s ease; }

    @keyframes pop {
      0%   { transform: rotateY(180deg) scale(1); }
      50%  { transform: rotateY(180deg) scale(1.15); }
      100% { transform: rotateY(180deg) scale(1); }
    }
    @keyframes shake {
      0%,100% { transform: rotateY(180deg) translateX(0); }
      25%      { transform: rotateY(180deg) translateX(-6px); }
      75%      { transform: rotateY(180deg) translateX(6px); }
    }

    /* ── Win overlay ── */
    #win-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #win-overlay.show { display: flex; }

    .win-box {
      background: white;
      border-radius: 24px;
      padding: 40px 48px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: zoomIn 0.4s cubic-bezier(.4,2,.6,1);
    }
    @keyframes zoomIn {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .win-emoji { font-size: 4rem; }
    .win-box h2 { font-size: 2rem; color: #7c3aed; margin: 8px 0; }
    .win-box p  { color: #666; font-size: 1rem; margin: 4px 0; }
    .win-score  { font-size: 1.4rem; font-weight: bold; color: #f97316; margin: 12px 0; }

    .action-btn {
      padding: 12px 28px;
      border: none; border-radius: 12px;
      font-size: 1rem; font-weight: bold;
      cursor: pointer;
      margin: 6px;
      transition: transform 0.15s;
    }
    .action-btn:hover { transform: scale(1.05); }
    .btn-replay  { background: #7c3aed; color: white; }
    .btn-menu    { background: #e5e7eb; color: #444; }

    /* ── Confetti canvas ── */
    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 99; }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .card { width: 72px; height: 72px; }
      .card-front.type-hira { font-size: 2rem; }
      .card-front.type-roma { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

<h1>🌸 ひらがなマッチ</h1>
<p class="subtitle">ひらがなとローマ字のペアを見つけよう！</p>

<!-- Level selector -->
<div id="level-screen">
  <h2>レベルをえらんでね</h2>
  <p>ひらがなとローマ字のカードをマッチさせよう！</p>
  <button class="level-btn btn-easy"   onclick="startGame('easy')">🌱 かんたん　（あ〜お　5ペア）</button>
  <button class="level-btn btn-medium" onclick="startGame('medium')">⭐ ふつう　  （あ〜こ　10ペア）</button>
  <button class="level-btn btn-hard"   onclick="startGame('hard')">🔥 むずかしい（あ〜と　15ペア）</button>
</div>

<!-- Stats -->
<div id="stats" style="display:none; flex-direction:row;">
  <div class="stat-box">
    <div class="stat-label">⏱ じかん</div>
    <div class="stat-value" id="timer">0:00</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">🎯 かいすう</div>
    <div class="stat-value" id="tries">0</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">✅ ペア</div>
    <div class="stat-value" id="matches">0</div>
  </div>
</div>

<!-- Card board -->
<div id="board"></div>

<!-- Win overlay -->
<div id="win-overlay">
  <div class="win-box">
    <div class="win-emoji" id="win-emoji">🎉</div>
    <h2>やったね！</h2>
    <p id="win-msg">ぜんぶみつけたよ！</p>
    <div class="win-score" id="win-score"></div>
    <br>
    <button class="action-btn btn-replay" onclick="replayGame()">🔄 もう一度</button>
    <button class="action-btn btn-menu"   onclick="goMenu()">📋 メニューへ</button>
  </div>
</div>

<canvas id="confetti"></canvas>

<script>
const HIRAGANA = [
  { hira: 'あ', roma: 'a'  }, { hira: 'い', roma: 'i'  }, { hira: 'う', roma: 'u'  },
  { hira: 'え', roma: 'e'  }, { hira: 'お', roma: 'o'  },
  { hira: 'か', roma: 'ka' }, { hira: 'き', roma: 'ki' }, { hira: 'く', roma: 'ku' },
  { hira: 'け', roma: 'ke' }, { hira: 'こ', roma: 'ko' },
  { hira: 'さ', roma: 'sa' }, { hira: 'し', roma: 'shi'}, { hira: 'す', roma: 'su' },
  { hira: 'せ', roma: 'se' }, { hira: 'そ', roma: 'so' },
];

const LEVEL_SIZE = { easy: 5, medium: 10, hard: 15 };
const MEDALS = [
  { tries: 10, emoji: '🥇', msg: 'かんぺき！すごすぎる！' },
  { tries: 15, emoji: '🥈', msg: 'すばらしい！よくできました！' },
  { tries: 99, emoji: '🥉', msg: 'よくがんばったね！' },
];

let currentLevel = 'easy';
let flipped = [];
let matched = 0;
let totalPairs = 0;
let tries = 0;
let timerInterval = null;
let elapsed = 0;
let locked = false;

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function startGame(level) {
  currentLevel = level;
  const pairs = HIRAGANA.slice(0, LEVEL_SIZE[level]);
  totalPairs = pairs.length;
  flipped = []; matched = 0; tries = 0; locked = false;

  // Build card data: one hiragana card + one romaji card per pair
  let cards = [];
  pairs.forEach((p, i) => {
    cards.push({ id: i, type: 'hira', display: p.hira, pairId: i });
    cards.push({ id: i, type: 'roma', display: p.roma, pairId: i });
  });
  cards = shuffle(cards);

  // Render board
  const board = document.getElementById('board');
  board.innerHTML = '';
  board.style.display = 'flex';
  document.getElementById('level-screen').style.display = 'none';

  const cols = totalPairs <= 5 ? totalPairs : (totalPairs <= 10 ? 5 : 6);
  board.style.gridTemplateColumns = `repeat(${cols}, 90px)`;
  board.style.display = 'flex';

  cards.forEach((c, idx) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.pairId = c.pairId;
    el.dataset.type   = c.type;
    el.dataset.idx    = idx;
    el.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back">🌸</div>
        <div class="card-face card-front type-${c.type}">${c.display}</div>
      </div>`;
    el.addEventListener('click', () => flipCard(el));
    board.appendChild(el);
  });

  // Stats
  const statsEl = document.getElementById('stats');
  statsEl.style.display = 'flex';
  document.getElementById('tries').textContent   = 0;
  document.getElementById('matches').textContent = '0/' + totalPairs;
  resetTimer();
  startTimer();
}

function flipCard(el) {
  if (locked) return;
  if (el.classList.contains('flipped') || el.classList.contains('matched')) return;
  if (flipped.length >= 2) return;

  el.classList.add('flipped');
  flipped.push(el);

  if (flipped.length === 2) {
    tries++;
    document.getElementById('tries').textContent = tries;
    checkMatch();
  }
}

function checkMatch() {
  const [a, b] = flipped;
  const samePair   = a.dataset.pairId === b.dataset.pairId;
  const diffType   = a.dataset.type   !== b.dataset.type;

  if (samePair && diffType) {
    // Match!
    a.classList.add('matched');
    b.classList.add('matched');
    matched++;
    document.getElementById('matches').textContent = matched + '/' + totalPairs;
    flipped = [];
    if (matched === totalPairs) {
      clearInterval(timerInterval);
      setTimeout(showWin, 600);
    }
  } else {
    locked = true;
    setTimeout(() => {
      a.classList.remove('flipped');
      b.classList.remove('flipped');
      a.classList.add('shake');
      b.classList.add('shake');
      setTimeout(() => { a.classList.remove('shake'); b.classList.remove('shake'); }, 400);
      flipped = [];
      locked = false;
    }, 900);
  }
}

function showWin() {
  const medal = MEDALS.find(m => tries <= m.tries) || MEDALS[MEDALS.length - 1];
  document.getElementById('win-emoji').textContent = medal.emoji;
  document.getElementById('win-msg').textContent   = medal.msg;
  document.getElementById('win-score').textContent =
    `⏱ ${formatTime(elapsed)}　🎯 ${tries}かい`;
  document.getElementById('win-overlay').classList.add('show');
  launchConfetti();
}

function replayGame() {
  document.getElementById('win-overlay').classList.remove('show');
  startGame(currentLevel);
}

function goMenu() {
  document.getElementById('win-overlay').classList.remove('show');
  document.getElementById('board').style.display     = 'none';
  document.getElementById('stats').style.display    = 'none';
  document.getElementById('level-screen').style.display = 'block';
  clearInterval(timerInterval);
  stopConfetti();
}

// ── Timer ──
function startTimer() {
  elapsed = 0;
  timerInterval = setInterval(() => {
    elapsed++;
    document.getElementById('timer').textContent = formatTime(elapsed);
  }, 1000);
}
function resetTimer() {
  clearInterval(timerInterval);
  elapsed = 0;
  document.getElementById('timer').textContent = '0:00';
}
function formatTime(s) {
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

// ── Confetti ──
let confettiAnim = null;
const COLORS = ['#7c3aed','#f97316','#10b981','#fbbf24','#ec4899','#3b82f6'];

function launchConfetti() {
  const canvas  = document.getElementById('confetti');
  const ctx     = canvas.getContext('2d');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;

  const pieces = Array.from({ length: 120 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * -canvas.height,
    r: 6 + Math.random() * 8,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    vx: (Math.random() - 0.5) * 3,
    vy: 3 + Math.random() * 4,
    rot: Math.random() * 360,
    drot: (Math.random() - 0.5) * 8,
  }));

  let frame = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.x  += p.vx; p.y  += p.vy; p.rot += p.drot;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r * 0.6);
      ctx.restore();
    });
    frame++;
    if (frame < 180) confettiAnim = requestAnimationFrame(draw);
    else stopConfetti();
  }
  draw();
}

function stopConfetti() {
  if (confettiAnim) cancelAnimationFrame(confettiAnim);
  const canvas = document.getElementById('confetti');
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
}
</script>
</body>
</html>
