<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>助詞の練習 | Particle Practice</title>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #f5f3ff;
      --card:     #ffffff;
      --primary:  #7c3aed;
      --pri-dark: #5b21b6;
      --green:    #059669;
      --green-bg: #d1fae5;
      --word-col: #1e293b;
      --text:     #334155;
      --muted:    #64748b;
      --border:   #e2e8f0;
      --shadow:   0 4px 24px rgba(124,58,237,.12);
      --r:        16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Klee One', 'UD デジタル 教科書体 NK-R', 'Hiragino Maru Gothic ProN', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
    }
    rt { font-size: .55em; line-height: 1.3; }

    /* ── Header ── */
    .app-header {
      background: linear-gradient(135deg, var(--pri-dark), var(--primary));
      color: white; text-align: center; padding: 22px 20px 18px;
    }
    .app-header h1 { font-size: 1.7rem; letter-spacing: 3px; }
    .app-header p  { font-size: .8rem; opacity: .7; margin-top: 3px; letter-spacing: 1px; }

    /* ── Screens ── */
    .screen { display: none; }
    .screen.active { display: block; }

    /* ═══════ SETUP ═══════ */
    #setup { max-width: 600px; margin: 0 auto; padding: 28px 16px; }

    .card-section {
      background: var(--card); border-radius: var(--r);
      padding: 24px; margin-bottom: 16px; box-shadow: var(--shadow);
    }
    .card-section h2 {
      font-size: .8rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 2px; margin-bottom: 18px;
    }

    /* Particle chips */
    .p-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .p-chip {
      display: flex; flex-direction: column; align-items: center;
      padding: 10px 14px; min-width: 64px;
      border-radius: 14px; border: 2px solid var(--border);
      background: white; color: var(--muted);
      cursor: pointer; transition: .15s; user-select: none;
    }
    .p-chip:hover:not(.on) { border-color: var(--primary); color: var(--primary); }
    .p-chip.on { color: white; }
    .p-chip-char { font-size: 1.5rem; font-weight: 700; line-height: 1.2; }
    .p-chip-sub  { font-size: .62rem; margin-top: 3px; opacity: .9; white-space: nowrap; }

    .selected-info { margin-top: 12px; font-size: .85rem; color: var(--muted); }

    /* Badge */
    .word-badge {
      text-align: center; padding: 14px;
      background: var(--green-bg); border-radius: 12px;
      color: var(--green); font-weight: 700; font-size: 1rem;
    }
    .word-badge span { font-size: 1.9rem; vertical-align: middle; }

    /* Toggle */
    .toggle-row {
      display: flex; align-items: center;
      justify-content: space-between; margin-top: 14px;
    }
    .toggle-label { font-size: .95rem; }
    .sw { position: relative; width: 46px; height: 25px; }
    .sw input { opacity: 0; width: 0; height: 0; }
    .sw-slider {
      position: absolute; inset: 0;
      background: var(--border); border-radius: 13px;
      cursor: pointer; transition: .2s;
    }
    .sw-slider::before {
      content: ''; position: absolute;
      width: 19px; height: 19px; left: 3px; top: 3px;
      background: white; border-radius: 50%; transition: .2s;
    }
    .sw input:checked + .sw-slider { background: var(--primary); }
    .sw input:checked + .sw-slider::before { transform: translateX(21px); }

    /* Stepper */
    .stepper { display: flex; align-items: center; gap: 14px; }
    .step-btn {
      width: 46px; height: 46px; border-radius: 50%;
      border: 2px solid var(--primary); background: white;
      color: var(--primary); font-size: 1.4rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: .15s; flex-shrink: 0;
    }
    .step-btn:hover:not(:disabled) { background: var(--primary); color: white; }
    .step-btn:disabled { border-color: var(--border); color: var(--border); cursor: not-allowed; }
    .step-info { flex: 1; text-align: center; }
    .step-main { font-size: 1.25rem; font-weight: 700; color: var(--word-col); }
    .step-sub  { font-size: .8rem; color: var(--muted); margin-top: 2px; }

    /* Start button */
    .start-btn {
      width: 100%; padding: 17px;
      background: linear-gradient(135deg, var(--pri-dark), var(--primary));
      color: white; border: none; border-radius: var(--r);
      font-size: 1.1rem; font-weight: 700; cursor: pointer; letter-spacing: .5px;
      box-shadow: 0 6px 20px rgba(124,58,237,.35);
      transition: transform .15s, box-shadow .15s;
    }
    .start-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(124,58,237,.45);
    }
    .start-btn:disabled { opacity: .35; cursor: not-allowed; transform: none; box-shadow: none; }

    /* ═══════ PRACTICE ═══════ */
    #practice { max-width: 700px; margin: 0 auto; padding: 20px 16px; }

    .prac-header {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 14px;
    }
    .back-btn {
      background: none; border: none;
      color: var(--primary); font-size: .9rem; font-weight: 600;
      cursor: pointer; padding: 4px 0;
    }
    .back-btn:hover { text-decoration: underline; }
    .prog-text { color: var(--muted); font-size: .95rem; }
    .prog-text strong { color: var(--primary); font-size: 1.05rem; }
    .rows-badge {
      font-size: .85rem; color: var(--muted);
      background: white; border: 1px solid var(--border);
      border-radius: 20px; padding: 3px 12px;
      letter-spacing: 1px;
    }
    .prog-bar {
      height: 4px; background: var(--border);
      border-radius: 2px; margin-bottom: 24px; overflow: hidden;
    }
    .prog-fill {
      height: 100%; background: var(--primary);
      border-radius: 2px; transition: width .35s ease;
    }

    /* Flash card — fixed height so buttons never move */
    .flash-card {
      background: white; border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,.09);
      padding: 36px 44px 32px;
      height: 400px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      margin-bottom: 20px; text-align: center;
    }

    /* Sentence with blank */
    .sentence-q {
      font-size: clamp(1.6rem, 4.5vw, 2.2rem);
      color: var(--word-col);
      line-height: 1.7;
      word-break: keep-all;
    }
    .blank-slot {
      display: inline-block;
      min-width: 1.8em;
      border-bottom: 3px solid #94a3b8;
      vertical-align: middle;
      margin: 0 4px;
      position: relative;
      top: -2px;
    }

    /* Answer reveal */
    /* Meaning — always visible below the sentence */
    .meaning-box {
      display: inline-block; font-size: 1rem;
      color: var(--green); font-weight: 500;
      background: var(--green-bg); border-radius: 12px;
      padding: 6px 20px; margin-top: 14px;
    }

    /* Answer reveal — particle + role + full reading */
    .answer-wrap {
      overflow: hidden;
      transition: max-height .4s ease, opacity .3s ease;
      max-height: 0; opacity: 0; margin-top: 0;
      border-top: 1px solid var(--border);
      width: 100%;
    }
    .answer-wrap.open { max-height: 160px; opacity: 1; margin-top: 20px; padding-top: 18px; }

    .particle-reveal {
      font-size: 3.2rem; font-weight: 700;
      letter-spacing: 4px; line-height: 1;
      margin-bottom: 2px;
    }
    .particle-meta {
      font-size: .9rem; color: var(--muted); margin-bottom: 10px;
    }
    .sentence-full {
      font-size: 1.1rem; color: var(--text);
      letter-spacing: .5px;
    }

    /* Controls */
    .main-action { margin-bottom: 10px; }
    .main-action .main-btn { width: 100%; }
    .controls { display: flex; gap: 10px; align-items: stretch; }
    .nav-btn {
      padding: 14px 16px; border: 2px solid var(--border);
      background: white; border-radius: 12px;
      font-size: .9rem; color: var(--muted);
      cursor: pointer; transition: .15s; min-width: 76px;
    }
    .nav-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .nav-btn:disabled { opacity: .3; cursor: not-allowed; }
    .main-btn {
      padding: 16px 20px; background: var(--primary);
      color: white; border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: background .15s;
    }
    .main-btn:hover { background: var(--pri-dark); }
    .main-btn.revealed { background: var(--green); }
    .main-btn.revealed:hover { background: #047857; }
    /* Hint bar — selected particles shown during practice */
    .hint-bar {
      display: flex; flex-wrap: wrap; gap: 7px;
      justify-content: center; margin-bottom: 14px;
    }
    .hint-chip {
      padding: 5px 14px; border-radius: 20px;
      font-size: 1.05rem; font-weight: 700;
      color: white; letter-spacing: 1px;
      opacity: .85;
    }

    .kbd-hint {
      text-align: center; color: var(--muted);
      font-size: .78rem; margin-top: 14px;
    }
    kbd {
      background: white; border: 1px solid var(--border);
      border-radius: 4px; padding: 1px 5px;
      font-size: .72rem; font-family: monospace;
    }

    /* ═══════ COMPLETE ═══════ */
    #complete { max-width: 420px; margin: 60px auto; padding: 20px; text-align: center; }
    .complete-card {
      background: white; border-radius: 24px;
      padding: 48px 36px; box-shadow: var(--shadow);
    }
    .complete-emoji { font-size: 3.5rem; margin-bottom: 14px; }
    .complete-card h2 { font-size: 1.6rem; color: var(--word-col); margin-bottom: 6px; }
    .complete-card p  { color: var(--muted); margin-bottom: 28px; }
    .btn-stack { display: flex; flex-direction: column; gap: 10px; }
    .btn-pri {
      padding: 14px; background: var(--primary);
      color: white; border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 600; cursor: pointer; transition: .15s;
    }
    .btn-pri:hover { background: var(--pri-dark); }
    .btn-sec {
      padding: 14px; background: white; color: var(--text);
      border: 2px solid var(--border); border-radius: 12px;
      font-size: 1rem; font-weight: 600; cursor: pointer; transition: .15s;
    }
    .btn-sec:hover { border-color: var(--primary); color: var(--primary); }

    @media (max-width: 480px) {
      .flash-card { padding: 24px 20px; height: 380px; }
      .sentence-q { font-size: 1.5rem; }
      .particle-reveal { font-size: 2.6rem; }
      .p-chip { min-width: 56px; padding: 8px 10px; }
      .p-chip-char { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

<div class="app-header">
  <h1><ruby>助詞<rt>じょし</rt></ruby>の<ruby>練習<rt>れんしゅう</rt></ruby></h1>
  <p>Japanese Particle Practice</p>
</div>

<!-- ──────────── SETUP ──────────── -->
<div id="setup" class="screen active">

  <div class="card-section">
    <h2><ruby>練習<rt>れんしゅう</rt></ruby>する<ruby>助詞<rt>じょし</rt></ruby>を<ruby>選<rt>えら</rt></ruby>んでください（13<ruby>種類<rt>しゅるい</rt></ruby>）</h2>
    <div class="p-chips" id="p-chips"></div>
    <div class="selected-info" id="selected-info">
      <ruby>助詞<rt>じょし</rt></ruby>を<ruby>選択<rt>せんたく</rt></ruby>してください
    </div>
  </div>

  <div class="card-section">
    <div class="word-badge">
      <ruby>利用<rt>りよう</rt></ruby>できる<ruby>例文<rt>れいぶん</rt></ruby>：<span id="sent-count">0</span> <ruby>問<rt>もん</rt></ruby>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">🔀 シャッフル</span>
      <label class="sw">
        <input type="checkbox" id="shuffle" checked>
        <span class="sw-slider"></span>
      </label>
    </div>
  </div>

  <div class="card-section">
    <h2><ruby>出題数<rt>しゅつだいすう</rt></ruby></h2>
    <div class="stepper">
      <button class="step-btn" id="prob-minus" onclick="changeProbs(-1)" disabled>−</button>
      <div class="step-info">
        <div class="step-main" id="prob-label"><ruby>全<rt>すべ</rt></ruby>て</div>
        <div class="step-sub"  id="prob-sub"><ruby>助詞<rt>じょし</rt></ruby>を<ruby>選<rt>えら</rt></ruby>ぶと<ruby>設定<rt>せってい</rt></ruby>できます</div>
      </div>
      <button class="step-btn" id="prob-plus" onclick="changeProbs(1)" disabled>＋</button>
    </div>
  </div>

  <button class="start-btn" id="start-btn" disabled onclick="startPractice()">
    <ruby>練習<rt>れんしゅう</rt></ruby>を<ruby>始<rt>はじ</rt></ruby>める →
  </button>
</div>

<!-- ──────────── PRACTICE ──────────── -->
<div id="practice" class="screen">
  <div class="prac-header">
    <button class="back-btn" onclick="goSetup()">← <ruby>設定<rt>せってい</rt></ruby></button>
    <div class="prog-text"><strong id="p-cur">1</strong> / <span id="p-tot">0</span></div>
    <div class="rows-badge" id="rows-badge"></div>
  </div>
  <div class="prog-bar">
    <div class="prog-fill" id="prog-fill" style="width:0%"></div>
  </div>

  <!-- Selected particles shown as hint during practice -->
  <div class="hint-bar" id="hint-bar"></div>

  <div class="flash-card">
    <!-- Always visible: sentence + English meaning -->
    <div class="sentence-q" id="sentence-q"></div>
    <div class="meaning-box" id="ans-meaning"></div>

    <!-- Revealed: particle + its role + full reading -->
    <div class="answer-wrap" id="answer-wrap">
      <div class="particle-reveal" id="ans-particle"></div>
      <div class="particle-meta"  id="ans-meta"></div>
      <div class="sentence-full"  id="ans-sentence"></div>
    </div>
  </div>

  <div class="main-action">
    <button class="main-btn" id="main-btn" onclick="doMain()">
      <ruby>答<rt>こた</rt></ruby>えを<ruby>見<rt>み</rt></ruby>る
    </button>
  </div>
  <div class="controls">
    <button class="nav-btn" id="prev-btn" onclick="go(-1)" disabled>← <ruby>前<rt>まえ</rt></ruby>へ</button>
    <button class="nav-btn" id="skip-btn" onclick="go(1)">スキップ →</button>
  </div>
  <div class="kbd-hint">
    <kbd>Space</kbd> <ruby>答<rt>こた</rt></ruby>えを<ruby>見<rt>み</rt></ruby>る / <ruby>次<rt>つぎ</rt></ruby>へ &nbsp;
    <kbd>←</kbd><kbd>→</kbd> <ruby>前後<rt>ぜんご</rt></ruby>に<ruby>移動<rt>いどう</rt></ruby>
  </div>
</div>

<!-- ──────────── COMPLETE ──────────── -->
<div id="complete" class="screen">
  <div class="complete-card">
    <div class="complete-emoji">🎉</div>
    <h2>お<ruby>疲<rt>つか</rt></ruby>れさまでした！</h2>
    <p><ruby>全<rt>すべ</rt></ruby>ての<ruby>例文<rt>れいぶん</rt></ruby>を<ruby>確認<rt>かくにん</rt></ruby>しました</p>
    <div class="btn-stack">
      <button class="btn-pri" onclick="restart()">🔄 もう<ruby>一度<rt>いちど</rt></ruby></button>
      <button class="btn-sec" onclick="goSetup()">← <ruby>設定<rt>せってい</rt></ruby>に<ruby>戻<rt>もど</rt></ruby>る</button>
    </div>
  </div>
</div>

<script>
// ── Particle definitions ──
const PARTICLES = [
  { id:'ga',   char:'が',   romaji:'ga',   meaning:'subject',    color:'#ef4444' },
  { id:'wo',   char:'を',   romaji:'wo',   meaning:'object',     color:'#f97316' },
  { id:'ni',   char:'に',   romaji:'ni',   meaning:'to / at',    color:'#d97706' },
  { id:'e',    char:'へ',   romaji:'e',    meaning:'toward',     color:'#16a34a' },
  { id:'de_place', char:'で', romaji:'de', meaning:'場所 location', color:'#06b6d4' },
  { id:'de_means', char:'で', romaji:'de', meaning:'手段 means/by',  color:'#0369a1' },
  { id:'kara', char:'から', romaji:'kara', meaning:'from',       color:'#2563eb' },
  { id:'made', char:'まで', romaji:'made', meaning:'until / to', color:'#7c3aed' },
  { id:'no',   char:'の',   romaji:'no',   meaning:'of / \'s',  color:'#db2777' },
  { id:'to',   char:'と',   romaji:'to',   meaning:'with / and', color:'#0e7490' },
  { id:'yori', char:'より', romaji:'yori', meaning:'than',       color:'#65a30d' },
  { id:'wa',   char:'は',   romaji:'wa',   meaning:'topic',      color:'#f43f5e' },
  { id:'mo',   char:'も',   romaji:'mo',   meaning:'also / too', color:'#a855f7' },
];

// ── Sentence database ──
const ALL_SENTENCES = [
  // ── が ──
  { pid:'ga', before:'ねこ',         after:'います。',               reading:'ねこがいます。',               meaning:'There is a cat.' },
  { pid:'ga', before:'あめ',         after:'ふっています。',           reading:'あめがふっています。',           meaning:"It's raining." },
  { pid:'ga', before:'コーヒー',     after:'すきです。',               reading:'コーヒーがすきです。',           meaning:'I like coffee.' },
  { pid:'ga', before:'ともだち',     after:'きます。',                 reading:'ともだちがきます。',             meaning:'My friend is coming.' },
  { pid:'ga', before:'どれ',         after:'いいですか。',             reading:'どれがいいですか。',             meaning:'Which one is good?' },
  { pid:'ga', before:'あのひと',     after:'せんせいです。',           reading:'あのひとがせんせいです。',       meaning:'That person is the teacher.' },
  { pid:'ga', before:'どのいろ',     after:'すきですか。',             reading:'どのいろがすきですか。',         meaning:'Which color do you like?' },
  { pid:'ga', before:'むこう',       after:'えきです。',               reading:'むこうがえきです。',             meaning:'That way is the station.' },

  // ── を ──
  { pid:'wo', before:'ごはん',       after:'たべます。',               reading:'ごはんをたべます。',             meaning:'I eat rice.' },
  { pid:'wo', before:'みず',         after:'のみます。',               reading:'みずをのみます。',               meaning:'I drink water.' },
  { pid:'wo', before:'えいが',       after:'みます。',                 reading:'えいがをみます。',               meaning:'I watch a movie.' },
  { pid:'wo', before:'にほんご',     after:'べんきょうします。',       reading:'にほんごをべんきょうします。',   meaning:'I study Japanese.' },
  { pid:'wo', before:'おんがく',     after:'ききます。',               reading:'おんがくをききます。',           meaning:'I listen to music.' },
  { pid:'wo', before:'ほん',         after:'よみます。',               reading:'ほんをよみます。',               meaning:'I read a book.' },
  { pid:'wo', before:'でんしゃ',     after:'のります。',               reading:'でんしゃをのります。',           meaning:'I ride the train.' },
  { pid:'wo', before:'まど',         after:'あけます。',               reading:'まどをあけます。',               meaning:'I open the window.' },

  // ── に ──
  { pid:'ni', before:'がっこう',     after:'いきます。',               reading:'がっこうにいきます。',           meaning:'I go to school.' },
  { pid:'ni', before:'7じ',          after:'おきます。',               reading:'7じにおきます。',               meaning:'I wake up at 7.' },
  { pid:'ni', before:'つくえのうえ', after:'あります。',               reading:'つくえのうえにあります。',       meaning:"It's on the desk." },
  { pid:'ni', before:'ともだち',     after:'てがみをかきます。',       reading:'ともだちにてがみをかきます。',   meaning:'I write a letter to my friend.' },
  { pid:'ni', before:'とうきょう',   after:'すんでいます。',           reading:'とうきょうにすんでいます。',     meaning:'I live in Tokyo.' },
  { pid:'ni', before:'ともだち',     after:'あいます。',               reading:'ともだちにあいます。',           meaning:'I meet my friend.' },
  { pid:'ni', before:'ここ',         after:'おいてください。',         reading:'ここにおいてください。',         meaning:'Please put it here.' },
  { pid:'ni', before:'にほん',       after:'りょこうします。',         reading:'にほんにりょこうします。',       meaning:'I travel to Japan.' },

  // ── へ ──
  { pid:'e',  before:'にほん',       after:'いきたいです。',           reading:'にほんへいきたいです。',         meaning:'I want to go to Japan.' },
  { pid:'e',  before:'うみ',         after:'いきましょう。',           reading:'うみへいきましょう。',           meaning:"Let's go to the sea." },
  { pid:'e',  before:'みぎ',         after:'まがってください。',       reading:'みぎへまがってください。',       meaning:'Please turn right.' },
  { pid:'e',  before:'いえ',         after:'かえります。',             reading:'いえへかえります。',             meaning:'I return home.' },
  { pid:'e',  before:'かいしゃ',     after:'いきます。',               reading:'かいしゃへいきます。',           meaning:'I go to the office.' },
  { pid:'e',  before:'ゆうびんきょく', after:'いきます。',             reading:'ゆうびんきょくへいきます。',     meaning:'I go to the post office.' },

  // ── で（場所）──
  { pid:'de_place', before:'こうえん',   after:'あそびます。',         reading:'こうえんであそびます。',           meaning:'I play in the park.' },
  { pid:'de_place', before:'スーパー',   after:'かいます。',           reading:'スーパーでかいます。',             meaning:'I buy it at the supermarket.' },
  { pid:'de_place', before:'としょかん', after:'べんきょうします。',   reading:'としょかんでべんきょうします。',   meaning:'I study at the library.' },
  { pid:'de_place', before:'レストラン', after:'たべます。',           reading:'レストランでたべます。',           meaning:'I eat at the restaurant.' },
  { pid:'de_place', before:'えき',       after:'きっぷをかいます。',   reading:'えきできっぷをかいます。',         meaning:'I buy a ticket at the station.' },

// ── State ──
let selectedParticles = new Set();
let probCount = 0;
let deck = [], idx = 0, open = false;

// ── Init chips ──
(function initChips() {
  const el = document.getElementById('p-chips');
  PARTICLES.forEach(p => {
    const d = document.createElement('div');
    d.className = 'p-chip';
    d.id = 'chip-' + p.id;
    d.innerHTML = `<span class="p-chip-char">${p.char}</span><span class="p-chip-sub">${p.romaji} — ${p.meaning}</span>`;
    d.onclick = () => toggleParticle(p.id);
    el.appendChild(d);
  });
})();

function toggleParticle(id) {
  if (selectedParticles.has(id)) selectedParticles.delete(id);
  else selectedParticles.add(id);
  refreshSetup();
}

function getParticle(id) {
  return PARTICLES.find(p => p.id === id);
}

function countAvailable() {
  return ALL_SENTENCES.filter(s => selectedParticles.has(s.pid)).length;
}

function particleLabel() {
  const active = PARTICLES.filter(p => selectedParticles.has(p.id));
  if (active.length === 0) return '';
  if (active.length <= 6) return active.map(p => p.char).join('・');
  return active.slice(0, 6).map(p => p.char).join('・') + '…';
}

function refreshSetup() {
  PARTICLES.forEach(p => {
    const chip = document.getElementById('chip-' + p.id);
    if (selectedParticles.has(p.id)) {
      chip.classList.add('on');
      chip.style.backgroundColor = p.color;
      chip.style.borderColor = p.color;
    } else {
      chip.classList.remove('on');
      chip.style.backgroundColor = '';
      chip.style.borderColor = '';
    }
  });

  const avail = countAvailable();
  document.getElementById('sent-count').textContent = avail;
  document.getElementById('selected-info').innerHTML =
    selectedParticles.size === 0
      ? '<ruby>助詞<rt>じょし</rt></ruby>を<ruby>選択<rt>せんたく</rt></ruby>してください'
      : `<strong>${avail}</strong> <ruby>問<rt>もん</rt></ruby>が<ruby>利用<rt>りよう</rt></ruby>できます`;
  document.getElementById('start-btn').disabled = avail === 0;
  refreshProbs(avail);
}

function refreshProbs(avail) {
  if (avail === undefined) avail = countAvailable();
  const lbl = document.getElementById('prob-label');
  const sub = document.getElementById('prob-sub');
  const mn  = document.getElementById('prob-minus');
  const pl  = document.getElementById('prob-plus');
  if (avail === 0) {
    lbl.innerHTML = '<ruby>全<rt>すべ</rt></ruby>て';
    sub.innerHTML = '<ruby>助詞<rt>じょし</rt></ruby>を<ruby>選<rt>えら</rt></ruby>ぶと<ruby>設定<rt>せってい</rt></ruby>できます';
    mn.disabled = pl.disabled = true;
    return;
  }
  if (probCount === 0 || probCount >= avail) probCount = 0;
  if (probCount === 0) {
    lbl.innerHTML = '<ruby>全<rt>すべ</rt></ruby>て';
    sub.innerHTML = `${avail} <ruby>問<rt>もん</rt></ruby>すべて<ruby>出題<rt>しゅつだい</rt></ruby>`;
    mn.disabled = avail <= 1; pl.disabled = true;
  } else {
    lbl.innerHTML = `${probCount} <ruby>問<rt>もん</rt></ruby>`;
    sub.innerHTML = `${avail} <ruby>問<rt>もん</rt></ruby>中 ${probCount} <ruby>問<rt>もん</rt></ruby>を<ruby>出題<rt>しゅつだい</rt></ruby>`;
    mn.disabled = probCount <= 1;
    pl.disabled = probCount >= avail;
  }
}

function changeProbs(d) {
  const avail = countAvailable();
  if (avail === 0) return;
  const cur = probCount === 0 ? avail : probCount;
  const next = cur + d;
  probCount = (next >= avail) ? 0 : Math.max(1, next);
  refreshProbs(avail);
}

// ── Practice ──
function startPractice() {
  deck = ALL_SENTENCES.filter(s => selectedParticles.has(s.pid));
  if (document.getElementById('shuffle').checked) {
    deck = [...deck].sort(() => Math.random() - .5);
  }
  if (probCount > 0 && probCount < deck.length) deck = deck.slice(0, probCount);
  idx = 0; open = false;
  document.getElementById('rows-badge').textContent = particleLabel();
  document.getElementById('p-tot').textContent = deck.length;

  // Build hint bar
  const hintBar = document.getElementById('hint-bar');
  hintBar.innerHTML = '';
  PARTICLES.filter(p => selectedParticles.has(p.id)).forEach(p => {
    const chip = document.createElement('div');
    chip.className = 'hint-chip';
    chip.textContent = p.char;
    chip.style.backgroundColor = p.color;
    hintBar.appendChild(chip);
  });
  show('practice');
  render();
}

function render() {
  const s = deck[idx];
  const p = getParticle(s.pid);

  // Sentence with blank
  document.getElementById('sentence-q').innerHTML =
    `${s.before}<span class="blank-slot">&nbsp;&nbsp;&nbsp;</span>${s.after}`;

  // Answer content
  document.getElementById('ans-particle').textContent  = p.char;
  document.getElementById('ans-particle').style.color  = p.color;
  document.getElementById('ans-meta').textContent      = `${p.romaji}  —  ${p.meaning}`;
  document.getElementById('ans-sentence').textContent  = s.reading;
  document.getElementById('ans-meaning').textContent   = s.meaning;

  document.getElementById('answer-wrap').classList.toggle('open', open);

  const mb = document.getElementById('main-btn');
  if (open) {
    mb.innerHTML = '<ruby>次<rt>つぎ</rt></ruby>の<ruby>問題<rt>もんだい</rt></ruby> →';
    mb.className = 'main-btn revealed';
  } else {
    mb.innerHTML = '<ruby>答<rt>こた</rt></ruby>えを<ruby>見<rt>み</rt></ruby>る';
    mb.className = 'main-btn';
  }

  document.getElementById('p-cur').textContent = idx + 1;
  const pct = ((idx + (open ? 1 : 0)) / deck.length) * 100;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prev-btn').disabled = idx === 0;
  document.getElementById('skip-btn').disabled = idx === deck.length - 1 && !open;
}

function doMain() {
  if (!open) { open = true; render(); }
  else { go(1); }
}

function go(dir) {
  const next = idx + dir;
  if (next < 0) return;
  if (next >= deck.length) { show('complete'); return; }
  idx = next; open = false; render();
}

function restart() {
  if (document.getElementById('shuffle').checked) {
    deck = [...deck].sort(() => Math.random() - .5);
  }
  idx = 0; open = false; show('practice'); render();
}

function goSetup() { show('setup'); }

function show(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(name).classList.add('active');
}

document.addEventListener('keydown', e => {
  if (!document.getElementById('practice').classList.contains('active')) return;
  if (e.code === 'Space')           { e.preventDefault(); doMain(); }
  else if (e.code === 'ArrowRight') { go(1); }
  else if (e.code === 'ArrowLeft')  { go(-1); }
});

refreshSetup();
</script>
